$kind: http-request
url: "{{baseUrl}}/driver/:id"
method: GET
pathVariables:
  id: "{{driverID}}"
auth:
  type: jwt
  credentials:
    isSecretBase64Encoded: true
    secret: "{{jwtSecret}}"
    algorithm: HS256
    payload: "{}"
    addTokenTo: header
    headerPrefix: Bearer
    queryParamKey: token
    header: "{}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("SafetyScore is a number", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData.safetyScore).to.be.a('number');
      });

      pm.test("SafetyScore between 0 and 100"), function () {
          pm.expect(jsonData.safetyScore).to.be.above(-1);
          pm.expect(jsonData.safetyScore).to.be.below(101);
      };
    language: text/javascript
order: 1000
